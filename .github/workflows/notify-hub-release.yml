name: Notify Hub of a formal source Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Stable Release tag to recover
        required: true
        type: string

# The GitHub-provided token only reads this source Release/tag. The separate
# dispatcher App is installed only on the Hub and has Actions: write only.
permissions:
  contents: read

jobs:
  notify-hub:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the default branch validation helper
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Require a stable semantic version tag
        env:
          tag: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          set -euo pipefail
          [[ "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
            echo "published Release tag is not a stable semantic version" >&2
            exit 1
          }

      - name: Read and verify the current Release
        id: release
        env:
          tag: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          set -euo pipefail
          release=$(curl --fail --silent --show-error \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${{ github.token }}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/$tag")
          python3 tools/validate_release.py "$tag" "$GITHUB_REPOSITORY" <<< "$release" >> "$GITHUB_OUTPUT"

      - name: Resolve the verified release tag to its commit SHA
        id: resolve
        env:
          tag: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          target_sha=$(curl --fail --silent --show-error \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${{ github.token }}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/$tag" | jq -r '.sha // empty')
          [[ "$target_sha" =~ ^[0-9a-fA-F]{40}$ ]] || {
            echo "release tag did not resolve to a 40-character commit SHA" >&2
            exit 1
          }
          printf 'target_sha=%s\n' "$target_sha" >> "$GITHUB_OUTPUT"

      - name: Create Hub-only workflow dispatcher token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.RDK_RELEASE_DISPATCHER_APP_ID }}
          private-key: ${{ secrets.RDK_RELEASE_DISPATCHER_PRIVATE_KEY }}
          owner: D-Robotics
          repositories: rdk-skills
          permission-actions: write

      - name: Dispatch the verified Release to the Hub
        env:
          schema_version: "1"
          source_repo: ${{ github.repository }}
          tag: ${{ steps.release.outputs.tag }}
          release_url: ${{ steps.release.outputs.release_url }}
          target_sha: ${{ steps.resolve.outputs.target_sha }}
          published_at: ${{ steps.release.outputs.published_at }}
        run: |
          set -euo pipefail
          payload=$(jq -n \
            --argjson schema_version "$schema_version" \
            --arg source_repo "$source_repo" \
            --arg tag "$tag" \
            --arg release_url "$release_url" \
            --arg target_sha "$target_sha" \
            --arg published_at "$published_at" \
            '{ref: "main", inputs: {
              schema_version: ($schema_version | tostring),
              source_repo: $source_repo,
              tag: $tag,
              release_url: $release_url,
              target_sha: $target_sha,
              published_at: $published_at,
              dry_run: "false"
            }}')
          curl --fail --silent --show-error --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${{ steps.app-token.outputs.token }}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --url "https://api.github.com/repos/D-Robotics/rdk-skills/actions/workflows/component-upgrade.yml/dispatches" \
            --data "$payload"
